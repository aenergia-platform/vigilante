# Vigilante externo de aEnergia — corre en ubuntu-latest, NUNCA en el servidor que vigila.
# Repo PÚBLICO a propósito: así los minutos de ubuntu-latest no cuentan contra el cupo de la
# organización. Sin secretos: solo el GITHUB_TOKEN del propio run, para la issue `caida`.
name: vigilante

on:
  schedule:
    - cron: '2-59/5 * * * *'  # el sondeo, cada 5 min y lejos del minuto 0 (GitHub no lo garantiza puntual)
    - cron: '23 7 1,15 * *'   # el latido: sin actividad en 60 días, GitHub apaga el schedule
  workflow_dispatch:
    inputs:
      direccion_falsa:
        description: 'SOLO para probar el aviso: una dirección que NO existe, leída como una más. Vacío = sondeo normal.'
        required: false
        default: ''

permissions:
  contents: read
  issues: write

concurrency:
  group: vigilante
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Leer PROD y PRUEBAS
        env:
          GH_TOKEN: ${{ github.token }}
          DIRECCION_FALSA: ${{ inputs.direccion_falsa }}
          AVISAR: '@aenergia-admin'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash vigilante.sh

  latido:
    if: github.event.schedule == '23 7 1,15 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Commit de latido
        run: |
          date -u +'Último latido: %Y-%m-%dT%H:%MZ' > LATIDO.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add LATIDO.md
          git commit -m 'latido: el schedule sigue vivo'
          git push
